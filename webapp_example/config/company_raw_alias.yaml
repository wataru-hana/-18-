# 企業別RAW正規化テーブル
# RAWレコードのitem_rawをSTD層に渡る前に標準語に翻訳する
# これにより、企業固有の表記を統一的な標準語に変換してからSTDマッピングを適用する
# 注意: 完全一致のみ。部分一致は行わない。
# キーは normalize_alias_key() で正規化される（空白と括弧を除去）

companies:
  # 東北キング
  tohoku_king:
    # 雑線 - 正規化後のキーで登録
    # "上線（80％） (（80％）)" -> 正規化後 "上線80％80％"
    上線80％80％: 雑線80%
    # "上線（80％）" -> 正規化後 "上線80％"
    上線80％: 雑線80%
    # "上線（60％）SV (（60％）SV)" -> 正規化後 "上線60％SV60％SV"
    上線60％SV60％SV: 雑線60%-65%
    # "上線（60％）SV" -> 正規化後 "上線60％SV"
    上線60％SV: 雑線60%-65%
    # アルミ
    # "アルミ（63S） (（63S）)" -> 正規化後 "アルミ63S63S"
    アルミ63S63S: アルミサッシ
    # "アルミ（63S）" -> 正規化後 "アルミ63S"
    アルミ63S: アルミサッシ
    # 真鍮・砲金
    込真鍮: 真鍮
    砲金コロ: 砲金
    # 鉛
    鉛: 鉛バッテリー
  
  # 後方互換性のため、name（東北キング）も追加
  東北キング:
    上線80％80％: 雑線80%
    上線80％: 雑線80%
    上線60％SV60％SV: 雑線60%-65%
    上線60％SV: 雑線60%-65%
    アルミ63S63S: アルミサッシ
    アルミ63S: アルミサッシ
    込真鍮: 真鍮
    砲金コロ: 砲金
    鉛: 鉛バッテリー
  
  # 鴻陽産業株式会社 岐阜工場
  kouyou_sangyou_gifu:
    # 正規化後のキーで登録（normalize_alias_keyで空白・括弧除去、normalize_item_nameで小文字化）
    # "UPピカ銅" -> normalize_item_name -> "upピカ銅" -> normalize_alias_key -> "upピカ銅"
    upピカ銅: ピカ銅
    # "税込UP上銅" -> normalize_item_name -> "税込up上銅" -> normalize_alias_key -> "税込up上銅"
    税込up上銅: ピカ銅
    # "UP電線A・80" -> normalize_item_name -> "up電線a80" -> normalize_alias_key -> "up電線a80"
    up電線a80: 雑線80%
    # "税込UP電線C・60" -> normalize_item_name -> "税込up電線c60" -> normalize_alias_key -> "税込up電線c60"
    税込up電線c60: 雑線60%-65%
    # "税込UPアルミサッシ" -> normalize_item_name -> "税込upアルミサッシ" -> normalize_alias_key -> "税込upアルミサッシ"
    税込upアルミサッシ: アルミサッシ
    # "税込UPアルミホイール" -> normalize_item_name -> "税込upアルミホイール" -> normalize_alias_key -> "税込upアルミホイール"
    税込upアルミホイール: アルミホイール
    # "税込アルミ缶" -> normalize_item_name -> "税込アルミ缶" -> normalize_alias_key -> "税込アルミ缶"
    税込アルミ缶: アルミ缶
    # "税込UPVA線" -> normalize_item_name -> "税込upva線" -> normalize_alias_key -> "税込upva線"
    税込upva線: VA線
    # "税込バッテリーA" -> normalize_item_name -> "税込バッテリーa" -> normalize_alias_key -> "税込バッテリーa"
    税込バッテリーa: 鉛バッテリー
    # その他のパターンも追加
    up電線a80: 雑線80%
    電線a80: 雑線80%
    up電線c60: 雑線60%-65%
    電線c60: 雑線60%-65%
    upアルミサッシ: アルミサッシ
    upアルミホイール: アルミホイール
    upva線: VA線
    バッテリーa: 鉛バッテリー
  
  # 後方互換性のため、name（鴻陽産業株式会社 岐阜工場）も追加
  鴻陽産業株式会社岐阜工場:
    upピカ銅: ピカ銅
    税込up上銅: ピカ銅
    up電線a80: 雑線80%
    電線a80: 雑線80%
    税込up電線c60: 雑線60%-65%
    up電線c60: 雑線60%-65%
    電線c60: 雑線60%-65%
    税込upアルミサッシ: アルミサッシ
    upアルミサッシ: アルミサッシ
    税込upアルミホイール: アルミホイール
    upアルミホイール: アルミホイール
    税込アルミ缶: アルミ缶
    税込upva線: VA線
    upva線: VA線
    税込バッテリーa: 鉛バッテリー
    バッテリーa: 鉛バッテリー
