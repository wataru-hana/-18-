<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクラップ価格自動取得システム - 最高価格表示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .status-success {
            background-color: #28a745;
            color: white;
        }
        .status-error {
            background-color: #dc3545;
            color: white;
        }
        .status-info {
            background-color: #17a2b8;
            color: white;
        }
        .max-price-card {
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: white;
        }
        .max-price-value {
            font-size: 2em;
            font-weight: bold;
            color: #28a745;
        }
        .company-name {
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4">スクラップ価格自動取得システム</h1>
        <p class="lead">各標準アイテムの最高価格を表示します</p>
        
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">スクレイピング実行</h5>
                <p class="card-text">全企業の価格を取得して、各アイテムの最高価格を計算します。</p>
                <button id="scrapeBtn" class="btn btn-primary" onclick="startScraping()">スクレイピング開始</button>
                <div id="status" class="mt-3"></div>
                <div id="progress" class="mt-3"></div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">各アイテムの最高価格</h5>
                <div id="max-prices">
                    <div class="alert alert-info">スクレイピングを実行してください。</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">システム状態</h5>
                <div id="status-info">
                    <p>データなし</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let scrapingInProgress = false;
        
        async function startScraping() {
            if (scrapingInProgress) {
                alert('スクレイピングは既に実行中です。');
                return;
            }
            
            scrapingInProgress = true;
            document.getElementById('scrapeBtn').disabled = true;
            document.getElementById('status').innerHTML = 
                '<span class="status-badge status-info">スクレイピング実行中...</span>';
            document.getElementById('progress').innerHTML = '';
            
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (data.status === 'completed') {
                    document.getElementById('status').innerHTML = 
                        `<span class="status-badge status-success">完了: ${data.total}社の価格を取得しました</span>`;
                    document.getElementById('progress').innerHTML = 
                        `<p>取得日時: ${new Date(data.scraped_at).toLocaleString('ja-JP')}</p>`;
                    
                    // 最高価格を表示
                    loadMaxPrices();
                    // システム状態を更新
                    loadStatus();
                } else {
                    document.getElementById('status').innerHTML = 
                        `<span class="status-badge status-error">エラー: ${data.error}</span>`;
                }
            } catch (error) {
                document.getElementById('status').innerHTML = 
                    `<span class="status-badge status-error">エラー: ${error.message}</span>`;
            } finally {
                scrapingInProgress = false;
                document.getElementById('scrapeBtn').disabled = false;
            }
        }
        
        async function loadMaxPrices() {
            try {
                const response = await fetch('/api/results/max-prices');
                const data = await response.json();
                
                if (data.length === 0) {
                    document.getElementById('max-prices').innerHTML = 
                        '<div class="alert alert-info">最高価格データがありません。先にスクレイピングを実行してください。</div>';
                    return;
                }
                
                let html = '<div class="row">';
                
                data.forEach(item => {
                    html += `
                        <div class="col-md-6 col-lg-4 mb-3">
                            <div class="max-price-card">
                                <h6 class="mb-2"><strong>${item.material}</strong></h6>
                                <div class="max-price-value">${item.max_price_str}</div>
                                <div class="company-name mt-2">${item.company}</div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                document.getElementById('max-prices').innerHTML = html;
            } catch (error) {
                document.getElementById('max-prices').innerHTML = 
                    `<div class="alert alert-danger">エラー: ${error.message}</div>`;
            }
        }
        
        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                let html = '<ul class="list-unstyled">';
                html += `<li>データ有無: ${data.has_data ? 'あり' : 'なし'}</li>`;
                html += `<li>企業数: ${data.company_count}社</li>`;
                if (data.last_scrape_time) {
                    html += `<li>最終取得日時: ${new Date(data.last_scrape_time).toLocaleString('ja-JP')}</li>`;
                }
                html += '</ul>';
                
                document.getElementById('status-info').innerHTML = html;
            } catch (error) {
                document.getElementById('status-info').innerHTML = 
                    `<p class="text-danger">エラー: ${error.message}</p>`;
            }
        }
        
        // ページ読み込み時に状態を確認
        window.addEventListener('load', () => {
            loadStatus();
            loadMaxPrices();
        });
    </script>
</body>
</html>
