# 企業別RAW正規化テーブル
# RAWレコードのitem_rawをSTD層に渡る前に標準語に翻訳する
# これにより、企業固有の表記を統一的な標準語に変換してからSTDマッピングを適用する
# 注意: 完全一致のみ。部分一致は行わない。
# キーは normalize_alias_key() で正規化される（空白と括弧を除去）

companies:
  # 東北キング
  tohoku_king:
    # 雑線 - 正規化後のキーで登録
    # "上線（80％） (（80％）)" -> 正規化後 "上線80％80％"
    上線80％80％: 雑線80%
    # "上線（80％）" -> 正規化後 "上線80％"
    上線80％: 雑線80%
    # "上線（60％）SV (（60％）SV)" -> 正規化後 "上線60％SV60％SV"
    上線60％SV60％SV: 雑線60%-65%
    # "上線（60％）SV" -> 正規化後 "上線60％SV"
    上線60％SV: 雑線60%-65%
    # アルミ
    # "アルミ（63S） (（63S）)" -> 正規化後 "アルミ63S63S"
    アルミ63S63S: アルミサッシ
    # "アルミ（63S）" -> 正規化後 "アルミ63S"
    アルミ63S: アルミサッシ
    # 真鍮・砲金
    込真鍮: 真鍮
    砲金コロ: 砲金
    # 鉛
    鉛: 鉛バッテリー
  
  # 後方互換性のため、name（東北キング）も追加
  東北キング:
    上線80％80％: 雑線80%
    上線80％: 雑線80%
    上線60％SV60％SV: 雑線60%-65%
    上線60％SV: 雑線60%-65%
    アルミ63S63S: アルミサッシ
    アルミ63S: アルミサッシ
    込真鍮: 真鍮
    砲金コロ: 砲金
    鉛: 鉛バッテリー
