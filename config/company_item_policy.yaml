# 会社別の採用ルール（衝突解決）
# 同一(company, 標準品目)に複数候補がある場合の優先順位を定義
# preferは完全一致を優先し、完全一致がない場合に部分一致を適用します
# （例：「並銅」をpreferに設定すると、「並銅」が完全一致で優先され、「込銅」は除外されます）

company_overrides:
  # 眞田鋼業株式会社の正式名称ルール
  # idフィールド（sanada）とname（眞田鋼業株式会社）の両方に対応
  sanada:
    ピカ銅:
      prefer: ["ピカ銅"]
    並銅:
      prefer: ["並銅"]
      reject: ["込銅"]  # 込銅を除外（並銅のみを採用）
    砲金:
      prefer: ["砲金"]
    真鍮:
      prefer: ["込真鍮"]
    雑線80%:
      prefer: ["上線(80%)"]
    雑線60%-65%:
      prefer: ["中線(65%)"]
    VA線:
      prefer: ["VA線"]
    アルミホイール:
      prefer: ["アルミホイール"]
    アルミサッシ:
      prefer: ["アルミサッシ", "ビスなし"]  # 「アルミサッシ」または「ビスなし」を含む行を優先
    アルミ缶:
      prefer: ["アルミ缶プレス"]  # アルミ缶は統一してSTDは「アルミ缶」1列
    ステンレス304:
      prefer: ["ステンレス（304）", "304"]
    鉛バッテリー:
      prefer: ["バッテリー"]
  
  # 後方互換性のため、name（眞田鋼業株式会社）も残す
  眞田鋼業株式会社:
    ピカ銅:
      prefer: ["ピカ銅"]
    並銅:
      prefer: ["並銅"]
      reject: ["込銅"]  # 込銅を除外（並銅のみを採用）
    砲金:
      prefer: ["砲金"]
    真鍮:
      prefer: ["込真鍮"]
    雑線80%:
      prefer: ["上線(80%)"]
    雑線60%-65%:
      prefer: ["中線(65%)"]
    VA線:
      prefer: ["VA線"]
    アルミホイール:
      prefer: ["アルミホイール"]
    アルミサッシ:
      prefer: ["アルミサッシ", "ビスなし"]  # 「アルミサッシ」または「ビスなし」を含む行を優先
    アルミ缶:
      prefer: ["アルミ缶プレス"]  # アルミ缶は統一してSTDは「アルミ缶」1列
    ステンレス304:
      prefer: ["ステンレス（304）", "304"]
    鉛バッテリー:
      prefer: ["バッテリー"]
  
  # 有限会社金田商事の正式名称ルール
  有限会社金田商事:
    並銅:
      prefer:
        - "銅（並）銅管"
      reject:
        - "込銅（並）"
        - "雑銅"
        - "雑銅（込銅）"
        - "銅（下）"
        - "銅 雑線"
        - "銅 被覆付銅管"
  
  # 東起産業（株）の正式名称ルール
  touki:
    ピカ銅:
      prefer: ["ピカ銅"]
    並銅:
      prefer: ["並銅"]
    砲金:
      prefer: ["砲金"]
    真鍮:
      prefer: ["真鍮A"]
    雑線80%:
      prefer: ["一本線80%"]
    雑線60%-65%:
      prefer: ["三本線65%"]
    VA線:
      prefer: ["VA線・巻物"]
    アルミホイール:
      prefer: ["アルミホイール"]
    アルミサッシ:
      prefer: ["アルミサッシA 付物なし"]
    ステンレス304:
      prefer: ["ステンレス"]
    鉛バッテリー:
      prefer: ["自動車バッテリー"]
  
  # 後方互換性のため、name（東起産業（株））も追加
  東起産業（株）:
    ピカ銅:
      prefer: ["ピカ銅"]
    並銅:
      prefer: ["並銅"]
    砲金:
      prefer: ["砲金"]
    真鍮:
      prefer: ["真鍮A"]
    雑線80%:
      prefer: ["一本線80%"]
    雑線60%-65%:
      prefer: ["三本線65%"]
    VA線:
      prefer: ["VA線・巻物"]
    アルミホイール:
      prefer: ["アルミホイール"]
    アルミサッシ:
      prefer: ["アルミサッシA 付物なし"]
    ステンレス304:
      prefer: ["ステンレス"]
    鉛バッテリー:
      prefer: ["自動車バッテリー"]
  
  # 東北キングの正式名称ルール
  tohoku_king:
    ピカ銅:
      prefer: ["ピカ銅", "1号銅"]
    鉛バッテリー:
      prefer_by_contains: ["バッテ", "車バッテ", "バッテリー"]
      reject_if_exact: ["鉛"]
  
  # 後方互換性のため、name（東北キング）も追加
  東北キング:
    ピカ銅:
      prefer: ["ピカ銅", "1号銅"]
    鉛バッテリー:
      reject: ["鉛"]
  
  # 必要に応じて以下に追加してください
  # company_id:
  #   標準品目名:
  #     prefer: ["優先するitem_rawのリスト（部分一致）"]
  #     reject: ["除外するitem_rawのリスト（完全一致）"]


