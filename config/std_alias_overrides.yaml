# STD alias overrides（企業別の標準品目への直接マッピング）
# このファイルは、企業固有のitem_rawを標準品目に直接マッピングするための設定
# 完全一致のみ。部分一致は行わない（ogakiは特に禁止）

companies:
  # 株式会社 大垣金属
  ogaki:
    ピカ銅:
      - ピカ線
      - ピカ線（ピカ銅）
      - ピカ線(ピカ銅)
      - ピカ線ピカ銅
    真鍮:
      - 真鍮（異物無）
      - 真鍮(異物無)
      - 真鍮異物無
    砲金:
      - 砲金（青銅）
      - 砲金(青銅)
      - 砲金青銅
      - 青銅
    VA線:
      - VA線
      - va線
      - VA線・巻物
      - VA線（巻物）
      - VA線(巻物)
      - ＶＡ線
      # ogakiで「VA線」が「線」として抽出される問題の暫定対応
      # 「線」だけがitem_rawの場合（「三本線B」など他の線は別item_rawとして抽出されている）、VA線として扱う
      - 線
    雑線80%:
      - 電線A
      - 電線A（80％以上）
      - 電線A(80%以上)
    雑線60%-65%:
      - 三本線A
      - 三本線A（60％）
      - 三本線A(60%)
      - 三本線A60
    アルミ缶:
      - バラ缶

